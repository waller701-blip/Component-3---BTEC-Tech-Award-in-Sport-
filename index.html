<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8">
<title>BTEC Sport Question Bank</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#d9dee3;--ac:#1f7a4d;--ac2:#e3f3ec;--nv:#1a3a8f;--pu:#6b2fa0;--rd:#b01e4a;--wn:#a15c00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161a;--card:#1c2126;--tx:#e8eaed;--mu:#9aa4af;--bd:#313a42;--ac:#4fc79b;--ac2:#1b3a2e;--wn:#e0a24a}}
:root[data-theme="dark"]{--bg:#13161a;--card:#1c2126;--tx:#e8eaed;--mu:#9aa4af;--bd:#313a42;--ac:#4fc79b;--ac2:#1b3a2e;--wn:#e0a24a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--bd)}
header h1{font-size:18px;margin:0;flex:1;min-width:200px}
.tabs button{padding:7px 14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;font:inherit}
.tabs button:first-child{border-radius:8px 0 0 8px}.tabs button:last-child{border-radius:0 8px 8px 0}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:1100px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 8px}
.mu{color:var(--mu);font-size:13px}.wn{color:var(--wn)}
.up{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.up label{display:block;border:2px dashed var(--bd);border-radius:10px;padding:14px;text-align:center;cursor:pointer}
.up label:hover{border-color:var(--ac);background:var(--ac2)}
.up input{display:none}
button.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;font:inherit;cursor:pointer}
input[type=text],select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;max-width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.tr{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin:6px 0}
@media(max-width:600px){.tr{grid-template-columns:1fr}}
.lay{display:grid;grid-template-columns:240px 1fr;gap:16px}
@media(max-width:760px){.lay{grid-template-columns:1fr}}
.tp{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:8px 10px;margin-bottom:6px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.tp.on{background:var(--ac2);border-color:var(--ac)}
.tp span:last-child{color:var(--mu)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.qh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.chip{background:var(--ac2);color:var(--ac);border-radius:99px;padding:1px 10px;font-size:12px}
.qt{white-space:pre-wrap;max-height:9.5em;overflow:hidden;cursor:pointer;position:relative}
.qt.open{max-height:none}
.cx{background:var(--ac2);border-radius:8px;padding:8px 10px;margin-bottom:8px}.cx .qt{max-height:6em}.student .mvs{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--nv:#8fb0ff;--pu:#c39bff;--rd:#ff7a9c}}
.ttl{background:var(--nv);color:#fff;border:3px solid #0d2466;border-radius:12px;padding:8px 16px;display:inline-block;font-size:17px}
.tabs{display:flex;gap:10px}.tabs button{border-radius:12px!important;border-width:2px;font-weight:700;background:var(--card)}
#tq{border-color:var(--ac);color:var(--ac)}#tq.on{background:var(--ac);color:#fff}
#ts{border-color:var(--pu);color:var(--pu)}#ts.on{background:var(--pu);color:#fff;border-color:var(--pu)}
.topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.srch{flex:1;min-width:180px;border-radius:99px;padding:9px 14px}
button.hc{background:#3d4a5c;color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer}
.ctl{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.crow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:4px 0}.cl{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);min-width:120px}
.tc{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}.tc.on{border-color:var(--ac);background:var(--ac);color:#fff}.tc span{opacity:.7}
.ban{border:3px solid var(--nv);background:color-mix(in srgb,var(--nv) 10%,var(--card));color:var(--nv);border-radius:12px;padding:12px;text-align:center;font-weight:800;font-size:18px;margin:12px 0}
.q.lv1{border-top:6px solid #1f7a4d}.q.lv2{border-top:6px solid #b8710b}.q.lv3{border-top:6px solid #b01e4a}
.lvl{font-size:12px;font-weight:800;margin-bottom:4px}
#tp{border-color:var(--rd);color:var(--rd)}#tp.on{background:var(--rd);color:#fff;border-color:var(--rd)}
.pp{border-top:1px solid var(--bd);padding:8px 0}.pp>div:first-child{white-space:pre-wrap}.ms{background:var(--ac2);border-radius:8px;padding:8px 8px 8px 26px;margin:6px 0}
.ms2{background:var(--ac2);border-radius:8px;padding:8px;margin:6px 0;white-space:pre-wrap}
.dd{position:relative}.dd summary{cursor:pointer;border:2px solid var(--ac);color:var(--ac);border-radius:10px;padding:6px 12px;font-weight:700;list-style:none;background:var(--card)}
.ddp{position:absolute;z-index:30;top:110%;left:0;min-width:260px;max-height:60vh;overflow:auto;background:var(--card);border:2px solid var(--ac);border-radius:10px;padding:8px;display:grid;gap:4px}.ddp label{display:flex;gap:6px;align-items:center}
.lvs label{font-weight:700;margin-right:6px}.d1{color:#1f7a4d}.d2{color:#b8710b}.d3{color:#b01e4a}
button.pr{background:#c4410c;color:#fff;border:0;border-radius:10px;padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
#tmb{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;border:3px solid var(--pu);color:var(--pu);background:var(--card);border-radius:99px;padding:12px 20px;font:inherit;font-weight:800;cursor:pointer}
#tmr{position:fixed;left:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--card);border:2px solid var(--pu);border-radius:14px;padding:12px;width:290px;display:none}#tmr.on{display:block}
#tmd{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}#tmd.end{color:var(--rd)}
#tmr.big{inset:0;width:auto;border-radius:0;display:flex;flex-direction:column;justify-content:center;align-items:center}#tmr.big #tmd{font-size:20vw}
@media print{header,.topbar,.ctl,.acts,#tmb,#tmr,#modal{display:none!important}body{background:#fff;color:#000}.q{break-inside:avoid}}.lv1 .lvl{color:#1f7a4d}.lv2 .lvl{color:#b8710b}.lv3 .lvl{color:#b01e4a}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
#mb{background:var(--card);border-radius:12px;max-width:820px;width:100%;max-height:90vh;overflow:auto;padding:16px}
#mb pre{white-space:pre-wrap;font:inherit;margin:8px 0}
#mb canvas{display:block;max-width:100%;height:auto;border:1px solid var(--bd)}
</style></head>
<body>
<header><h1><span class="ttl">⚽ BTEC Tech Award Sport – Question Bank</span></h1>
<div class="tabs"><button id="tq" onclick="tab('q')">Questions</button><button id="tp" onclick="tab('p')">Practice</button><button id="ts" onclick="tab('s')">Setup</button></div></header>
<main id="app"></main>
<div id="modal" onclick="if(event.target===this)closeM()"><div id="mb"></div></div>
<button id="tmb" onclick="$('tmr').classList.toggle('on')">⏱ Timer</button>
<div id="tmr"><div id="tmd">05:00</div>
<div class="acts" style="justify-content:center"><button class="g" onclick="tm.base=60;tm.reset()">1 min</button><button class="g" onclick="tm.base=120;tm.reset()">2 min</button><button class="g" onclick="tm.base=180;tm.reset()">3 min</button><button class="g" onclick="tm.base=300;tm.reset()">5 min</button><button class="g" onclick="tm.base=600;tm.reset()">10 min</button><button class="g" onclick="tm.base=900;tm.reset()">15 min</button></div>
<div class="acts" style="justify-content:center"><button class="g" onclick="tm.add(-60)">−1 min</button><button class="g" onclick="tm.add(60)">+1 min</button></div>
<div class="acts" style="justify-content:center"><button class="b" id="tgo" onclick="tm.go()">Start</button><button class="g" onclick="tm.reset()">Reset</button><button class="g" onclick="$('tmr').classList.toggle('big')">Big screen</button><button class="g" onclick="$('tmr').classList.remove('on','big')">Close</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const S={files:[],topics:[],over:{},tab:'s',tsel:new Set(),pf:'all',busy:'',note:'',showCtx:true,lv:[1,2,3],q:'',hide:false,n:10,seed:0,ddo:''};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
try{pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}catch(e){}

/* ---------- storage (IndexedDB, private to this browser) ---------- */
const DB=new Promise(res=>{try{const r=indexedDB.open('btec-sport',1);r.onupgradeneeded=()=>{r.result.createObjectStore('f',{keyPath:'id'});r.result.createObjectStore('m',{keyPath:'k'})};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});
async function st(store,mode,fn){const d=await DB;if(!d)return;return new Promise(r=>{try{const t=d.transaction(store,mode);const q=fn(t.objectStore(store));t.oncomplete=()=>r(q&&q.result);t.onerror=()=>r()}catch(e){r()}})}
const saveMeta=()=>{st('m','readwrite',s=>s.put({k:'topics',v:S.topics}));st('m','readwrite',s=>s.put({k:'over',v:S.over}))};
const saveFile=f=>st('f','readwrite',s=>s.put(f));
async function load(){
  if(location.hash!=='#teacher'){try{const r=await fetch('bank.json',{cache:'no-cache'});if(r.ok){const b=await r.json();S.student=true;document.body.classList.add('student');S.files=b.files;S.topics=b.topics;S.over=b.over||{};S.tab='q';render();return}}catch(e){}}
  S.files=(await st('f','readonly',s=>s.getAll()))||[];
  for(const f of S.files){if(f.v!==3&&f.buf){try{S.busy='Updating '+f.name+'…';render();const r=await extract(f.buf);f.qs=split(r.lines,f.kind==='exam');f.v=3;await saveFile(f)}catch(e){}}}S.busy='';
  S.files.filter(f=>f.kind==='ms'&&!f.pair).forEach(f=>{const m=S.files.find(x=>x.kind==='exam'&&norm(x.name)===norm(f.name));if(m){f.pair=m.id;saveFile(f)}});
  const t=await st('m','readonly',s=>s.get('topics'));const o=await st('m','readonly',s=>s.get('over'));
  if(t)S.topics=t.v;if(o)S.over=o.v;
  S.tab=S.files.some(f=>f.kind==='exam')?'q':'s';render();
}

/* ---------- PDF reading ---------- */
async function extract(buf){
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(buf.slice(0))}).promise;const lines=[];
  for(let p=1;p<=pdf.numPages;p++){
    const tc=await (await pdf.getPage(p)).getTextContent();const rows=[];
    tc.items.forEach(i=>{if(!i.str||Math.abs(i.transform[1])>Math.abs(i.transform[0]))return;let r=rows.find(r=>Math.abs(r.y-i.transform[5])<3);if(!r){r={y:i.transform[5],it:[]};rows.push(r)}r.it.push(i)});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>{r.it.sort((a,b)=>a.transform[4]-b.transform[4]);let t='',end=null;r.it.forEach(i=>{const fs=Math.abs(i.transform[0])||i.height||10;if(end!==null&&!/^\s/.test(i.str)&&!/\s$/.test(t)&&i.transform[4]-end>fs*.15)t+=' ';t+=i.str;end=i.transform[4]+i.width});t=t.replace(/\ufb01/g,'fi').replace(/\ufb02/g,'fl').replace(/\s+/g,' ').trim();if(t)lines.push({p,t,y:r.y,h:Math.abs(r.it[0].transform[0])||10})});
  }
  return{lines,pages:pdf.numPages};
}
const JUNK=/^(\*?P\d{4,}[A-Z\d]*\*?|P\d{5}[A-Z]|Turn over|BLANK PAGE|(DO NOT WRITE IN THIS AREA\s*)+|[\d\/]{1,8}|QUESTION \d+ BEGINS ON THE NEXT PAGE|Question( Number( Answer Mark)?| Answer Mark ?Number)?|Number|Answer Mark( ?Number)?|©.*)$/i;
function marks(t){const m=t.join('\n').match(/Total for Question\s*\d+\s*=\s*(\d+)/i);if(m)return+m[1];let x=0;t.forEach(l=>{const k=l.match(/\((\d{1,2})\)\s*$/);if(k)x+=+k[1]});return x||null}
const CTX=/^((Scenario|Case study|Context)\b|Read the (following )?(scenario|case study|information|text|passage))/i;
const STRICT=/^(Scenario|Case study|Context)\b/i;
const REF=/\b(scenario|figure \d|table \d|case study|information (above|given)|the (text|passage|source))\b/i;
function split(lines,isExam){
  const L='abcdefghijklmnop',nx=p=>p?L[L.indexOf(p)+1]:'a',CAPR=/^(Figure|Table)\s+\d+$/;
  const out=[];let cq=0,cp='',cur=null,buf=[],ended=false;
  const dotOK=lines.filter(l=>/^\d{1,2}\s*\([a-z]/i.test(l.t)).length<3,bareOK=new Set();
  lines.forEach((l,i)=>{if(/^\d{1,2}$/.test(l.t.trim())&&lines.slice(Math.max(0,i-3),i+5).some(a=>/^(Responses will be credited|Learners|Award)/i.test(a.t)))bareOK.add(l)});
  const isA=(c,a)=>/\(\d{1,2}\)$/.test(a.t)||/^[A-D]\s/.test(a.t)||(CAPR.test(a.t)&&c.lines.some(b=>b!==a&&b.t.includes(a.t)));
  for(const l of lines){
    const t=l.t.replace(/[.\u2026]{4,}/g,'').replace(/\*?P\d{4,}[A-Z]*\d*\*?/g,'').replace(/\bTurn over\b/gi,'').replace(/\s+/g,' ').trim();
    const bare=!isExam&&bareOK.has(l)&&+t===cq+1;if(!t||(t!==l.t.trim()&&/^\d{1,2}$/.test(t))||(!bare&&JUNK.test(t)))continue;
    if(/^(Answer all questions|Some questions must be answered|answer, put a line through)/i.test(t)){buf=[];continue}
    const x={...l,t};let q=0,p='',nw=false,m;
    if(bare){q=+t;nw=true}
    else if(m=t.match(/^(?:Question\s+)?(\d{1,2})\s*\(([a-z])[a-z]*\)/i)){q=+m[1];p=m[2].toLowerCase();nw=(q===cq&&p===nx(cp))||(q===cq+1&&p==='a')}
    else if((m=t.match(/^(?:Question\s+)?(\d{1,2})([.)]?)\s+(?!marks?\b)\S/i))&&(dotOK||!m[2])){q=+m[1];nw=q===cq+1}
    else if(isExam&&cq&&(m=t.match(/^\(([a-z])\)\s/))){q=cq;p=m[1];nw=p===nx(cp)}
    if(nw){
      let lead=[];const nq=q!==cq;
      if(nq)lead=buf;
      else if(isExam&&cur){
        let k=-1;cur.lines.forEach((a,i)=>{if(isA(cur,a))k=i});
        if(k>=0){const tr=cur.lines.slice(k+1);
          if(tr.some(a=>CAPR.test(a.t)&&t.includes(a.t)))lead=tr;
          else{let j=tr.length;while(j>0&&(j===tr.length||tr[j-1].t.length>=30))j--;lead=tr.slice(j)}
          cur.lines.length-=lead.length}
      }
      const intro=nq?lead.map(a=>a.t).join('\n'):cur.intro,f0=lead[0]||x;
      cur={q,part:p,label:q+(p?'('+p+')':''),lines:[x],p:f0.p,y:f0.y,h:f0.h,intro,own:(!nq&&lead.length)?lead.map(a=>a.t).join('\n'):''};
      out.push(cur);cq=q;cp=p;buf=[];ended=false;continue;
    }
    if(ended)buf.push(x);
    else if(cur){cur.lines.push(x);if(isExam&&/Total for Question/i.test(t))ended=true}
    else if(isExam)buf.push(x);
  }
  return out.map((c,i)=>{
    const n=out[i+1],text=(c.own?c.own+'\n':'')+c.lines.map(a=>a.t).join('\n');
    let la=c.lines[c.lines.length-1];c.lines.forEach(a=>{if(isA(c,a))la=a});
    const fig=/\b(figure|table|picture|diagram|shown|image|chart|graph)\b/i.test(text);
    let y2=la.y-la.h*.6;if(fig&&/\(\d{1,2}\)$/.test(la.t))y2=(n&&n.p===la.p)?n.y+n.h*1.2:null;
    const mk=c.lines.filter(a=>/\(\d{1,2}\)$/.test(a.t)).reduce((s,a)=>s+ +a.t.match(/\((\d{1,2})\)$/)[1],0);
    return{n:c.q,part:c.part,label:c.label,p:c.p,y:c.y+c.h,p2:la.p,y2,text,intro:c.intro,marks:mk||null};
  });
}
function splitOld(lines,useCtx){
  const qs=[];let cur=null,n=1,pend=null,ctx=null,ended=false;
  const fin=()=>{if(pend){const t=pend.t.join('\n');if(pend.hard||t.length>180)ctx={text:t,p:pend.p};else if(/Section\s+[A-Z]\b/i.test(t))ctx=null;pend=null}};
  for(const l of lines){
    if(JUNK.test(l.t))continue;
    const m=l.t.match(/^(?:Question\s+)?(\d{1,2})(?=[\s(.]|$)\s*\.?\s*(.*)$/i);
    if(m&&+m[1]===n&&!/^marks?\b/i.test(m[2])){fin();cur={n,p:l.p,t:[l.t],ctx};qs.push(cur);n++;ended=false}
    else if(useCtx&&!pend&&(STRICT.test(l.t)||((ended||!cur)&&CTX.test(l.t)))){pend={t:[l.t],p:l.p,hard:true}}
    else if(pend)pend.t.push(l.t);
    else if(useCtx&&ended){pend={t:[l.t],p:l.p}}
    else if(cur&&/Total for Question/i.test(l.t)){cur.t.push(l.t);ended=true}
    else if(cur)cur.t.push(l.t);
  }
  return qs.map(q=>({n:q.n,p:q.p,text:q.t.join('\n'),marks:marks(q.t),ctx:q.ctx}));
}

/* ---------- topics from specification ---------- */
const STOP=new Set('learners should understand including their which these where would about other with from that this have been when into such also they what your each used using must able aims content'.split(' '));
const words=t=>(t.toLowerCase().match(/[a-z]{5,}/g)||[]).filter(w=>!STOP.has(w));
function kwFrom(text,name){
  const c={};words(text).forEach(w=>c[w]=(c[w]||0)+1);
  const top=Object.entries(c).filter(e=>e[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,12).map(e=>e[0]);
  return[...new Set([...words(name),...top])];
}
function topicsFromSpec(lines){
  const hs=[];
  lines.forEach((l,i)=>{const m=l.t.match(/^(?:Learning aim\s+)?([A-F]\d?)[:.\s]+([A-Z][^.]{3,70})$/)||l.t.match(/^(Topic area \d+|Unit \d+)[:.\s]+(.{3,70})$/i);if(m)hs.push({i,name:(m[1]+' '+m[2]).trim()})});
  const best={};
  hs.forEach((h,k)=>{const end=k+1<hs.length?hs[k+1].i:Math.min(lines.length,h.i+80);const txt=lines.slice(h.i+1,end).map(l=>l.t).join(' ');if(!best[h.name]||txt.length>best[h.name].txt.length)best[h.name]={txt,name:h.name}});
  return Object.values(best).map((b,i)=>({id:'t'+Date.now()+i,name:b.name,kw:kwFrom(b.txt,b.name)}));
}

/* ---------- categorising ---------- */
function classify(q){
  if(S.over[q.key])return S.over[q.key];
  const t=(q.text+' '+(q.ms||'')).toLowerCase();
  const sc=S.topics.map(tp=>({id:tp.id,s:tp.kw.reduce((a,k)=>{k=k.trim().toLowerCase();if(!k)return a;return a+(t.split(k).length-1)*(k.includes(' ')?2:1)},0)})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  if(!sc.length)return['none'];
  return sc.filter(x=>x.s>=sc[0].s*.7).slice(0,2).map(x=>x.id);
}

async function up(kind,files){
  for(const file of files){
    S.busy='Reading '+file.name+'…';render();
    try{
      const buf=await file.arrayBuffer();const {lines,pages}=await extract(buf);
      if(kind==='spec'){
        const tp=topicsFromSpec(lines);
        S.note=tp.length>1?'Found '+tp.length+' topics in the specification. Please check and tidy the keywords below.':'Couldn’t reliably detect headings in that PDF. Paste your topic list below instead.';
        if(tp.length>1&&(!S.topics.length||confirm('Replace the current topic list with the one from this specification?'))){S.topics=tp;saveMeta()}
      }else{
        const id='f'+Date.now()+Math.random().toString(36).slice(2,6);
        const f={id,kind,name:file.name,buf,pages,v:3,qs:split(lines,kind==='exam'),pair:''};
        if(kind==='ms'){const m=S.files.find(x=>x.kind==='exam'&&norm(x.name)===norm(f.name));if(m)f.pair=m.id}
        S.files.push(f);await saveFile(f);
        if(kind==='exam')S.files.filter(x=>x.kind==='ms'&&!x.pair).forEach(x=>{if(norm(x.name)===norm(f.name)){x.pair=f.id;saveFile(x)}});
      }
    }catch(e){S.note='Couldn’t read '+file.name+': '+e.message}
  }
  S.busy='';render();
}

function capInit(){
  const w=$('capw'),s=$('sel');let a=null;
  const pt=e=>{const r=$('cv').getBoundingClientRect();return{x:Math.max(0,Math.min(r.width,e.clientX-r.left)),y:Math.max(0,Math.min(r.height,e.clientY-r.top))}};
  w.onpointerdown=e=>{a=pt(e);w.setPointerCapture(e.pointerId);CAP.rect=null;s.style.display='none'};
  w.onpointermove=e=>{if(!a)return;const b=pt(e),x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),ww=Math.abs(a.x-b.x),hh=Math.abs(a.y-b.y);Object.assign(s.style,{display:'block',left:x+'px',top:y+'px',width:ww+'px',height:hh+'px'});CAP.rect={x,y,w:ww,h:hh}};
  w.onpointerup=()=>{a=null;if(CAP.rect&&(CAP.rect.w<8||CAP.rect.h<8)){CAP.rect=null;s.style.display='none'}};
}

   ${S.showCtx?q.ctxs.map(c=>`<div class="cx"><div class="mu"><b>${esc(c.title||'Scenario / context')}</b></div>${c.text?`<div class="qt" onclick="this.classList.toggle('open')">${esc(c.text)}</div>`:''}${c.img?`<img src="${c.img}" alt="${esc(c.title||'figure')}" style="max-width:100%;display:block;margin-top:6px;background:#fff">`:''}</div>`).join(''):''}
   ${!q.ctxs.length&&REF.test(q.text)?'<p class="wn">⚠ This question refers to a scenario or figure but none was detected – use “View original page”.</p>':''}
   <div class="qt" onclick="this.classList.toggle('open')" title="Click to expand">${esc(q.text)}</div>
   <div class="acts"><button class="b" onclick="viewMS('${q.key}')">View mark scheme</button><button class="g" onclick="viewPrint('${q.key}')">View as printed</button><button class="g" onclick="viewPg('${q.fid}',${q.p})">View original page</button>${q.ctxs.length?`<button class="g" onclick="viewPg('${q.fid}',${q.ctxs[0].p})">View scenario page</button>`:''}
   <select class="mvs" onchange="mv('${q.key}',this.value)"><option value="">Move to topic…</option>${S.topics.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div></div>`).join('')}
  </section></div>`;
}
load();
</script></body></html>
